<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#1a3060"/>
      <stop offset="100%" stop-color="#071021"/>
    </radialGradient>
    <radialGradient id="sg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd48a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd48a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mg" cx="65%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#61e4c2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#61e4c2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Ambient glows -->
  <circle cx="195" cy="220" r="130" fill="url(#sg)"/>
  <circle cx="370" cy="120" r="180" fill="url(#mg)"/>
  <!-- Sun -->
  <circle cx="195" cy="215" r="72" fill="#ffd48a" opacity="0.96"/>
  <!-- Cloud (partially overlaps sun) -->
  <circle cx="215" cy="315" r="62" fill="rgba(255,255,255,0.93)"/>
  <circle cx="300" cy="296" r="76" fill="rgba(255,255,255,0.93)"/>
  <circle cx="370" cy="320" r="54" fill="rgba(255,255,255,0.93)"/>
  <rect x="153" y="322" width="271" height="64" rx="32" fill="rgba(255,255,255,0.93)"/>
</svg>
